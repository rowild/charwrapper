<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Sets - CharWrapper</title>
  <link rel="stylesheet" href="../css/common.css">
  <style>
    .signature {
      max-width: 760px;
      margin: 2rem auto;
      text-align: left;
    }

    .signature h2 {
      font-size: 3rem;
      margin: 0 0 0.5rem;
    }

    .signature p {
      font-size: 1.25rem;
      margin: 0.25rem 0;
    }
  </style>
</head>
<body>
  <a href="../index.html" class="back-link">All Examples</a>

  <div class="container">
    <h1>Custom Sets</h1>

    <div class="example-tabs" role="tablist" aria-label="Example view">
      <button id="live-tab" type="button" role="tab" aria-selected="true" aria-controls="live-panel" onclick="showExampleTab('live')">Live</button>
      <button id="code-tab" type="button" role="tab" aria-selected="false" aria-controls="code-panel" onclick="showExampleTab('code')">Code</button>
    </div>

    <div id="live-panel" class="example-panel" role="tabpanel" aria-labelledby="live-tab">
      <div class="example-section">
        <div class="signature" data-root-set="signature">
          <h2><span data-set-name="first_name">Grace</span> <span data-set-name="last_name">Hopper</span></h2>
          <p data-set-name="role">Computer scientist</p>
          <p data-set-name="quote">The most dangerous phrase is: we have always done it this way.</p>
        </div>
      </div>

      <div class="controls">
        <button onclick="replay()">Replay</button>
      </div>
    </div>

    <div id="code-panel" class="example-panel code-panel" role="tabpanel" aria-labelledby="code-tab" hidden>
      <pre><code id="example-code"></code></pre>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="../../dist/charwrapper.js"></script>
  <script src="../js/code-highlight.js"></script>
  <script>
    let wrapper;
    let timeline;
    const exampleCode = String.raw`<div class="signature" data-root-set="signature">
  <h2>
    <span data-set-name="first_name">Grace</span>
    <span data-set-name="last_name">Hopper</span>
  </h2>
  <p data-set-name="role">Computer scientist</p>
  <p data-set-name="quote">The most dangerous phrase is: we have always done it this way.</p>
</div>

const wrapper = new CharWrapper('[data-root-set="signature"]', {
  wrap: { chars: true },
  rootSet: {
    customSets: {
      fullName: ['first_name', 'last_name'],
      introLine: ['first_name', 'last_name', 'role'],
      quoteOnly: rootSet => rootSet.attributeSets.quote.chars
    }
  }
});

const signatureRootSet = wrapper.wrap();

const timeline = gsap.timeline();
timeline.from(signatureRootSet.customSets.fullName, { opacity: 0, y: 28, stagger: 0.035 });
timeline.from(signatureRootSet.attributeSets.role.chars, { opacity: 0, x: -12, stagger: 0.02 }, '-=0.2');
timeline.from(signatureRootSet.customSets.quoteOnly, { opacity: 0, y: 12, stagger: 0.01 }, '-=0.1');`;

    renderExampleCode('example-code', exampleCode);

    function showExampleTab(name) {
      const live = name === 'live';
      document.getElementById('live-panel').hidden = !live;
      document.getElementById('code-panel').hidden = live;
      document.getElementById('live-tab').setAttribute('aria-selected', String(live));
      document.getElementById('code-tab').setAttribute('aria-selected', String(!live));
    }

    function build() {
      wrapper = new CharWrapper('[data-root-set="signature"]', {
        wrap: { chars: true },
        rootSet: {
          customSets: {
            fullName: ['first_name', 'last_name'],
            introLine: ['first_name', 'last_name', 'role'],
            quoteOnly: rootSet => rootSet.attributeSets.quote.chars
          }
        }
      });

      const signatureRootSet = wrapper.wrap();

      timeline = gsap.timeline();
      timeline.from(signatureRootSet.customSets.fullName, { opacity: 0, y: 28, stagger: 0.035 });
      timeline.from(signatureRootSet.attributeSets.role.chars, { opacity: 0, x: -12, stagger: 0.02 }, '-=0.2');
      timeline.from(signatureRootSet.customSets.quoteOnly, { opacity: 0, y: 12, stagger: 0.01 }, '-=0.1');
    }

    function replay() {
      if (timeline) timeline.kill();
      if (wrapper) wrapper.unwrap();
      build();
    }

    build();
  </script>
</body>
</html>
