<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Batch Root Sets - CharWrapper</title>
  <link rel="stylesheet" href="../css/common.css">
  <style>
    .root-grid {
      display: grid;
      gap: 1.25rem;
      max-width: 820px;
      margin: 2rem auto;
      text-align: left;
    }

    .root-row {
      padding: 1rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.18);
    }

    .root-row h2 {
      font-size: 2rem;
      margin: 0 0 0.25rem;
    }

    .root-row p {
      margin: 0;
      font-size: 1.15rem;
    }
  </style>
</head>
<body>
  <a href="../index.html" class="back-link">All Examples</a>

  <div class="container">
    <h1>Batch Root Sets</h1>

    <div class="example-tabs" role="tablist" aria-label="Example view">
      <button id="live-tab" type="button" role="tab" aria-selected="true" aria-controls="live-panel" onclick="showExampleTab('live')">Live</button>
      <button id="code-tab" type="button" role="tab" aria-selected="false" aria-controls="code-panel" onclick="showExampleTab('code')">Code</button>
    </div>

    <div id="live-panel" class="example-panel" role="tabpanel" aria-labelledby="live-tab">
      <div class="example-section">
        <div class="root-grid">
          <section class="root-row" data-root-set="footer" data-root-order="3">
            <h2 data-set-name="title" data-set-order="1">Footer</h2>
            <p data-set-name="body" data-set-order="2">Final supporting line.</p>
          </section>

          <section class="root-row" data-root-set="hero" data-root-order="1">
            <h2 data-set-name="title" data-set-order="1">Hero</h2>
            <p data-set-name="body" data-set-order="2">This root animates first.</p>
          </section>

          <section class="root-row" data-root-set="details" data-root-order="2">
            <h2 data-set-name="title" data-set-order="1">Details</h2>
            <p data-set-name="body" data-set-order="2">This root animates second.</p>
          </section>
        </div>
      </div>

      <div class="controls">
        <button onclick="replay()">Replay</button>
      </div>
    </div>

    <div id="code-panel" class="example-panel code-panel" role="tabpanel" aria-labelledby="code-tab" hidden>
      <pre><code id="example-code"></code></pre>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="../../dist/charwrapper.js"></script>
  <script src="../js/code-highlight.js"></script>
  <script>
    let rootSets = [];
    let timeline;
    const originalRoots = Array.from(document.querySelectorAll('[data-root-set]')).map(root => ({
      root,
      html: root.innerHTML
    }));
    const exampleCode = String.raw`<section data-root-set="footer" data-root-order="3">
  <h2 data-set-name="title" data-set-order="1">Footer</h2>
  <p data-set-name="body" data-set-order="2">Final supporting line.</p>
</section>

<section data-root-set="hero" data-root-order="1">
  <h2 data-set-name="title" data-set-order="1">Hero</h2>
  <p data-set-name="body" data-set-order="2">This root animates first.</p>
</section>

<section data-root-set="details" data-root-order="2">
  <h2 data-set-name="title" data-set-order="1">Details</h2>
  <p data-set-name="body" data-set-order="2">This root animates second.</p>
</section>

const rootSets = CharWrapper.wrapAll('[data-root-set]', {
  wrap: { chars: true },
  processing: { ordered: true }
});

const timeline = gsap.timeline();

rootSets.forEach(rootSet => {
  timeline.from(rootSet.attributeSets.title.chars, { opacity: 0, y: 24, stagger: 0.035 });
  timeline.from(rootSet.attributeSets.body.chars, { opacity: 0, y: 12, stagger: 0.01 }, '-=0.1');
});`;

    renderExampleCode('example-code', exampleCode);

    function showExampleTab(name) {
      const live = name === 'live';
      document.getElementById('live-panel').hidden = !live;
      document.getElementById('code-panel').hidden = live;
      document.getElementById('live-tab').setAttribute('aria-selected', String(live));
      document.getElementById('code-tab').setAttribute('aria-selected', String(!live));
    }

    function build() {
      rootSets = CharWrapper.wrapAll('[data-root-set]', {
        wrap: { chars: true },
        processing: { ordered: true }
      });

      timeline = gsap.timeline();

      rootSets.forEach(rootSet => {
        timeline.from(rootSet.attributeSets.title.chars, { opacity: 0, y: 24, stagger: 0.035 });
        timeline.from(rootSet.attributeSets.body.chars, { opacity: 0, y: 12, stagger: 0.01 }, '-=0.1');
      });
    }

    function replay() {
      if (timeline) timeline.kill();
      originalRoots.forEach(item => {
        item.root.innerHTML = item.html;
      });
      build();
    }

    build();
  </script>
</body>
</html>
